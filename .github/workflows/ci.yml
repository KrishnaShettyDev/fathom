name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase services
        run: npm run db:start > "$RUNNER_TEMP/fathom-supabase.log" 2>&1
      - run: npm run db:test
      - run: npm run test:migrations
      - run: npm run test:auth
      - run: npm run test:worker
      - run: npm run test:http
      - name: Stop local services
        if: always()
        run: npm run db:stop
