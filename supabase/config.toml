project_id = "fathom"
[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55432
shadow_port = 55430
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = true
port = 55434
[storage]
enabled = false
[realtime]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 10
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600
[auth.email.template.magic_link]
subject = "Your Fathom sign-in code"
content_path = "./supabase/templates/otp.html"
[auth.email.template.confirmation]
subject = "Your Fathom sign-in code"
content_path = "./supabase/templates/otp.html"
